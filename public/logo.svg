<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 48" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square with rising bars and a trend line -->
  <rect x="0" y="0" width="48" height="48" rx="10" fill="url(#iconGrad)"/>

  <!-- Rising bars -->
  <rect x="9" y="29" width="6" height="10" rx="1.5" fill="rgba(255,255,255,0.45)"/>
  <rect x="21" y="23" width="6" height="16" rx="1.5" fill="rgba(255,255,255,0.65)"/>
  <rect x="33" y="17" width="6" height="22" rx="1.5" fill="white"/>

  <!-- Trend line with arrowhead -->
  <polyline points="8,26 19,17 26,21 38,9" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="31,8.5 38.5,8.5 38.5,16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="58" y="33" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="22" letter-spacing="-0.5" fill="url(#grad)">StocksTrendz</text>
</svg>
